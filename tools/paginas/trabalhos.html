<!-- titulo: Trabalhos · Caverna Hair e Makeup -->
<!-- desc: Portfólio da Andréia Oliveira: loiros, morenas iluminadas, cortes, maquiagens, penteados e noivas. -->
<!-- lightbox: sim -->
---
<section class="secao topo-pag" aria-labelledby="t-trab">
  <div class="wrap">
    <div class="cab centro">
      <p class="rot">Portfólio</p>
      <h1 id="t-trab">Trabalhos</h1>
      <p class="lead">Clientes da Andréia, das mais recentes às mais antigas. Toque numa foto para ampliar.</p>
    </div>
    <div class="filtros-wrap">
      <div class="filtros" role="group" aria-label="Filtrar por serviço">
        <button type="button" data-f="todos" aria-pressed="true">Todos <sup></sup></button>
        <button type="button" data-f="cabelo" aria-pressed="false">Cabelo <sup></sup></button>
        <button type="button" data-f="make" aria-pressed="false">Maquiagem <sup></sup></button>
        <button type="button" data-f="penteado" aria-pressed="false">Penteados <sup></sup></button>
      </div>
    </div>
    <div class="grade" data-grade></div>
  </div>
</section>
<section class="secao escuro2 chamada" aria-labelledby="t-chamada">
  <div class="wrap centro">
    <p class="rot">Gostou de algum?</p>
    <h2 id="t-chamada">Reserve seu horário</h2>
    <p class="lead">Mande o print da foto que você gostou junto com o pedido de horário.</p>
    <div class="acoes">
      <a class="btn" href="agendar.html"><span>Agendar horário</span><i><!--brilho--></i></a>
      <a class="btn linha" href="<!--zap-->" target="_blank" rel="noopener"><span>Chamar no WhatsApp</span><i><!--seta--></i></a>
    </div>
  </div>
</section>
